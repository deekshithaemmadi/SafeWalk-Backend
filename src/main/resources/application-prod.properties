# Production profile. No fallbacks: the app refuses to start unless
# DB_URL, DB_USERNAME, DB_PASSWORD, JWT_SECRET (>= 32 bytes) and
# CORS_ALLOWED_ORIGINS are provided via the environment.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
safewalk.jwt.secret=${JWT_SECRET}
safewalk.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
