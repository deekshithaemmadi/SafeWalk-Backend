# Local development profile (active by default). Values here are LOCAL-ONLY
# fallbacks; every one of them can be overridden with the env variable.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/safewalk?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
# Insecure dev-only signing key. NEVER use outside a developer machine.
safewalk.jwt.secret=${JWT_SECRET:local-dev-only-insecure-secret-change-me-0123456789}
