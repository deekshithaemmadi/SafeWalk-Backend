spring.application.name=SafeWalkBackend

# Active profile defaults to "dev" for local work. Production MUST run with
# SPRING_PROFILES_ACTIVE=prod (which requires all secrets via env variables).
spring.profiles.default=dev

# ============================================================================
# Database — MySQL
# Credentials are NEVER hardcoded. Provide them via environment variables:
#   DB_URL, DB_USERNAME, DB_PASSWORD
# The values below are safe LOCAL DEVELOPMENT defaults only. For any real
# environment (including Aiven Cloud MySQL) set the variables and do not rely
# on these defaults.
# Example (Aiven):  DB_URL=jdbc:mysql://<host>:<port>/safewalk?ssl-mode=REQUIRED
# ============================================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# HikariCP connection pool (sane defaults)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# ============================================================================
# JPA / Hibernate
# Schema is managed by Flyway migrations, so Hibernate only VALIDATES the
# schema and never auto-creates/alters tables in any environment.
# ============================================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Cap client-requested page sizes on paginated endpoints.
spring.data.web.pageable.max-page-size=100
spring.jpa.properties.hibernate.format_sql=false
# Dialect is auto-detected from the MySQL JDBC connection.

# ============================================================================
# Flyway — database migrations
# ============================================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

# ============================================================================
# CORS — configurable allowed origins (comma-separated).
# Default is the local Vite dev server. Override via CORS_ALLOWED_ORIGINS.
# ============================================================================
safewalk.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ============================================================================
# Security / JWT
# The signing secret is NEVER hardcoded for real use. Provide a strong, random
# secret (>= 32 bytes) via the JWT_SECRET environment variable. The value below
# is a safe LOCAL DEVELOPMENT default only and must be overridden in production.
# ============================================================================
safewalk.jwt.secret=${JWT_SECRET}
# Token validity in milliseconds (default 24 hours).
safewalk.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}


# ============================================================================
# External mapping services (OpenStreetMap Nominatim + OSRM demo server).
# These are third-party public services: responses are live but NOT
# safety-aware. Timeouts are kept short so the API fails fast.
# ============================================================================
safewalk.maps.nominatim-base-url=${NOMINATIM_BASE_URL:https://nominatim.openstreetmap.org}
safewalk.maps.osrm-base-url=${OSRM_BASE_URL:https://router.project-osrm.org}
safewalk.maps.user-agent=${MAPS_USER_AGENT:SafeWalkBackend/1.0 (contact: set MAPS_USER_AGENT)}
safewalk.maps.connect-timeout-ms=${MAPS_CONNECT_TIMEOUT_MS:5000}
safewalk.maps.read-timeout-ms=${MAPS_READ_TIMEOUT_MS:10000}
safewalk.maps.geocode-country-codes=${GEOCODE_COUNTRY_CODES:in}

# ============================================================================
# Logging — never log request bodies, SQL parameters, tokens or passwords.
# ============================================================================
logging.level.root=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=OFF
server.error.include-stacktrace=never
server.error.include-message=never

# Import bundled static datasets (src/main/resources/datasets) on startup; idempotent, never deletes rows.
safewalk.datasets.import-on-startup=${DATASETS_IMPORT_ON_STARTUP:true}
