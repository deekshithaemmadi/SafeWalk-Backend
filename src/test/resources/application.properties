# ============================================================================
# TEST configuration — automatically used for `mvn test` only.
# Uses an in-memory H2 database so tests NEVER touch the real MySQL database.
# Flyway is disabled here; Hibernate builds a throwaway schema from entities.
# ============================================================================
spring.datasource.url=jdbc:h2:mem:safewalk_test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Build the (currently empty) schema from entities for the test run only.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Do not run production Flyway migrations against the in-memory test DB.
# (Spring Boot 4 has no Flyway auto-config; the app's FlywayConfig bean is
# gated on this property.)
# Production migrations are MySQL-specific; H2 tests build the schema from
# the JPA model instead. Real migrations are verified by MySqlMigrationIT.
spring.flyway.enabled=false

safewalk.cors.allowed-origins=http://localhost:5173

# Deterministic test signing secret (>= 32 bytes). Tests never use real secrets.
safewalk.jwt.secret=test-secret-test-secret-test-secret-0123456789abcdef
safewalk.jwt.expiration-ms=3600000


safewalk.maps.nominatim-base-url=http://127.0.0.1:1
safewalk.maps.osrm-base-url=http://127.0.0.1:1
safewalk.maps.connect-timeout-ms=500
safewalk.maps.read-timeout-ms=1000
safewalk.datasets.import-on-startup=false
